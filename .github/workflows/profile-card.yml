name: Update profile terminal card

on:
  schedule:
    # Refresh just after 08:00 and 00:00 in Asia/Ho_Chi_Minh.
    # Minutes are offset from the hour to reduce GitHub Actions queue delays.
    - cron: "5 1,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "github-fastfetch.jsonc"
      - "profile.json"
      - "scripts/**"
      - ".github/workflows/profile-card.yml"

concurrency:
  group: profile-terminal-card
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_USER: ${{ github.repository_owner }}

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Install jp2a
        timeout-minutes: 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get install --yes --no-install-recommends jp2a

      - name: Install Fastfetch
        timeout-minutes: 3
        run: |
          curl --location --fail \
            --output /tmp/fastfetch.deb \
            https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb
          sudo dpkg --install /tmp/fastfetch.deb

      - name: Fetch current avatar and GitHub metrics
        run: python3 scripts/fetch_github_metrics.py

      - name: Render terminal SVG
        run: bash scripts/render_profile_card.sh

      - name: Verify generated SVG
        run: |
          test -s github-terminal.svg
          grep --quiet '<svg' github-terminal.svg
          python3 scripts/test_profile_card.py

      - name: Commit refreshed card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-terminal.svg
          if git diff --cached --quiet; then
            echo "Profile card is already up to date"
            exit 0
          fi
          git commit -m "chore: refresh profile terminal card"
          git push
